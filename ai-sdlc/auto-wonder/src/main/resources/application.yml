spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mvc:
    async:
      request-timeout: 180000

mybatis:
  mapper-locations: classpath:mapping/*Dao.xml
  type-aliases-package: com.aliyun.autowonder.dao
  configuration:
    map-underscore-to-camel-case: true

logging:
  config: classpath:log4j2.xml

server:
  tomcat:
    threads:
      min-spare: 150
      max: 2000
      stuck-detected:
        threshold: 100
        interruptThreadThreshold: 110
    accept-count: 200
    max-connections: 1000

oss:
  enabled: ${OSS_ENABLED:true}
  endpoint: ${OSS_ENDPOINT:}
  public-endpoint: ${OSS_PUBLIC_ENDPOINT:}
  bucket: ${OSS_BUCKET:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  task-pkg-bucket: ${OSS_TASK_PKG_BUCKET:${OSS_BUCKET:}}
  artifact-bucket: ${OSS_ARTIFACT_BUCKET:${OSS_BUCKET:}}
  skill-bucket: ${OSS_SKILL_BUCKET:${OSS_BUCKET:}}

# S3-compatible object storage (AWS S3, MinIO, etc.). Mutually exclusive with oss.enabled.
# endpoint is used server-side; public-endpoint signs download URLs handed to clients.
s3:
  enabled: ${S3_ENABLED:false}
  endpoint: ${S3_ENDPOINT:}
  public-endpoint: ${S3_PUBLIC_ENDPOINT:}
  region: ${S3_REGION:us-east-1}
  access-key-id: ${S3_ACCESS_KEY_ID:}
  access-key-secret: ${S3_ACCESS_KEY_SECRET:}
  force-path-style: true
  # Bucket names are configured under oss.* (shared across backends), not here.

autowonder:
  version: ${AUTOWONDER_VERSION:x.x.x}
  public-base-url: ${AUTOWONDER_PUBLIC_BASE_URL:http://localhost:7001}
  # 社区版本：为 true 时前端隐藏新建 MCP 令牌入口中的「更多客户端接入」。
  # 支持环境变量 AUTOWONDER_COMMUNITY_EDITION 覆盖。
  community-edition: ${AUTOWONDER_COMMUNITY_EDITION:true}
  runtime:
    recommended-version: ${AUTOWONDER_RUNTIME_RECOMMENDED_VERSION:0.2.150}
  scheduled-task:
    # Enabled by default: a fresh community install imports the complete
    # docs/autowonder-schema.sql, so the module is ready immediately. When
    # upgrading an existing multi-node deployment, set all three to false until
    # every node runs the new schema — see docs/scheduled-task-operations.md.
    enabled: ${AUTOWONDER_SCHEDULED_TASK_ENABLED:true}
    scanner-enabled: ${AUTOWONDER_SCHEDULED_TASK_SCANNER_ENABLED:true}
    cluster-ready-attestation: ${AUTOWONDER_SCHEDULED_TASK_CLUSTER_READY:true}
    scan-fixed-delay-ms: ${AUTOWONDER_SCHEDULED_TASK_SCAN_FIXED_DELAY_MS:10000}
    scan-batch-size: ${AUTOWONDER_SCHEDULED_TASK_SCAN_BATCH_SIZE:100}
    lock-ttl-seconds: ${AUTOWONDER_SCHEDULED_TASK_LOCK_TTL_SECONDS:30}
  security:
    secret-crypto:
      master-key: ${AUTOWONDER_SECRET_MASTER_KEY:}
  jwt:
    secret: ${AUTOWONDER_JWT_SECRET:}
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800
  sls:
    enabled: ${AUTOWONDER_SLS_ENABLED:false}
    endpoint: ${SLS_ENDPOINT:}
    project: ${SLS_PROJECT:}
    sys-log-store: ${SLS_SYS_LOGSTORE:}
    biz-log-store: ${SLS_BIZ_LOGSTORE:}
    metric-log-store: ${SLS_METRIC_LOGSTORE:}
    access-key-id: ${SLS_ACCESS_KEY_ID:}
    access-key-secret: ${SLS_ACCESS_KEY_SECRET:}
    topic: ${SLS_TOPIC:}
    source: ${SLS_SOURCE:}
  integration:
    aone:
      enabled: ${AUTOWONDER_AONE_ENABLED:false}
      web-base-url: ${AUTOWONDER_AONE_WEB_BASE_URL:}
  metrics:
    sigar:
      enabled: ${AUTOWONDER_SIGAR_ENABLED:true}
  insights:
    human-agent:
      timezone: Asia/Shanghai
      cron: "0 0 3 * * *"
      cache-ttl-seconds: 97200
      lock-ttl-millis: 3600000
      refresh-core-pool-size: 1
      refresh-max-pool-size: 2
      refresh-queue-capacity: 20
